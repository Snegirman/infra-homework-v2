workflow:
  rules:
    - changes:
        - "**/*.md"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

stages:
  - install
  - lint
  - build
  - test
  - deploy

default:
  image: node:24

install:
  stage: install
  script: yarn install --immutable
  cache:
    key:
      files:
        - yarn.lock
      prefix: $CI_JOB_NAME
    paths:
      - .yarn/cache/
  artifacts:
    paths:
      - node_modules/

lint:
  stage: lint
  script: yarn lint
  needs:
    - install
  cache:
    key:
      files:
        - yarn.lock
      prefix: $CI_JOB_NAME
    paths:
      - node_modules/

build:
  stage: build
  script: yarn build:assets
  needs:
    - install
  cache:
    key:
      files:
        - yarn.lock
      prefix: $CI_JOB_NAME
    paths:
      - node_modules/
  artifacts:
    paths:
      - tasks/task-17/dist/

test:
  stage: test
  script: yarn test
  needs:
    - install
    - lint
    - build
  cache:
    key:
      files:
        - yarn.lock
      prefix: $CI_JOB_NAME-$NODE_VERSION
    paths:
      - node_modules/
  image: "node:${NODE_VERSION}"
  parallel:
    matrix:
      - NODE_VERSION: ["22", "24"]

deploy:
  image:
    name: amazon/aws-cli
    entrypoint:
      - ""
  stage: deploy
  script: aws s3 cp tasks/task-17/dist s3://infra-2/$GITLAB_USER_LOGIN/ --recursive --endpoint-url https://storage.yandexcloud.net --region ru-central1
  when: manual
  needs:
    - test
    - build
