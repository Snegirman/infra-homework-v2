workflow:
  rules:
    - changes:
        - "**/*.md"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

stages:
  - install
  - lint
  - build
  - test
  - deploy

default:
  image: node:24

install:
  stage: install
  script: yarn install --immutable
  cache:
    key:
      files:
        - yarn.lock
      prefix: $CI_JOB_NAME
    paths:
      - .yarn/cache/
  artifacts:
    paths:
      - node_modules/

lint:
  stage: lint
  script: yarn lint
  needs:
    - install
  cache:
    key:
      files:
        - yarn.lock
      prefix: $CI_JOB_NAME
    paths:
      - node_modules/

build:
  stage: build
  script: yarn build
  needs:
    - install
  cache:
    key:
      files:
        - yarn.lock
      prefix: $CI_JOB_NAME
    paths:
      - node_modules/

test:
  stage: test
  script: yarn test
  needs:
    - install
    - lint
    - build
  cache:
    key:
      files:
        - yarn.lock
      prefix: $CI_JOB_NAME-$NODE_VERSION
    paths:
      - node_modules/
  image: "node:${NODE_VERSION}"
  parallel:
    matrix:
      - NODE_VERSION: ["22", "24"]

deploy:
  stage: deploy
  script: yarn deploy
  when: manual
  needs:
    - install
    - test
  cache:
    key:
      files:
        - yarn.lock
      prefix: $CI_JOB_NAME
    paths:
      - node_modules/
